<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hush Grove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#0a120e;--ink:#f4ecd6;--sub:#b9c2a4;--amber:#e6c068;--glass:rgba(8,22,14,.8);--line:rgba(214,178,98,.4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;min-height:100vh;
font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
#rain,#fly,#forest{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 70% 45% at 78% 0%,rgba(240,170,90,.12),transparent 70%),
radial-gradient(ellipse 90% 40% at 50% 115%,rgba(210,120,60,.14),transparent 70%),
radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%)}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:22px 16px 120px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.12em;margin:8px 0 0}
.tag{color:var(--sub);font-size:14px;margin:2px 0 18px}
input,select,button{font:inherit;color:var(--ink)}
.field{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(20,16,12,.6);margin-bottom:12px;font-size:17px}
.field:focus{outline:2px solid var(--amber);outline-offset:1px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.bar .field{margin:0;flex:1}
.toggle{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15px;white-space:nowrap}
.toggle.on{background:var(--amber);color:#2a1c0e;border-color:var(--amber);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 15px;font-size:15px;cursor:pointer}
.chip.on{background:var(--amber);color:#2a1c0e;border-color:var(--amber);font-weight:700}
.drawer{color:var(--amber);font-size:15px;margin:22px 2px 10px;word-break:break-all;letter-spacing:.04em}
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.ico{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:rgba(240,179,106,.12);border-radius:14px;flex:none}
.nm{font-size:19px;font-weight:700}
.edit{margin-left:auto;font-size:14px;color:var(--amber);background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;background:rgba(10,8,6,.5);border-radius:12px;padding:10px 12px}
.k{font-size:12px;color:var(--sub);width:30px;flex:none}
.v{flex:1;font-size:18px;word-break:break-all}
.pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;letter-spacing:.06em;color:#ffe3b8}
.mini{border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 6px}
.memo{font-size:14px;color:var(--sub);margin-top:10px}
.fab{position:fixed;z-index:2;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--amber);color:#2a1c0e;border:0;border-radius:999px;padding:15px 24px;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--amber);color:#2a1c0e;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
.btn.g{background:transparent;color:var(--sub);border:1px solid var(--line)}
.btn.d{background:transparent;color:#ff9a85;margin-top:2px}
dialog{border:1px solid var(--line);border-radius:22px;background:#201a15;color:var(--ink);width:min(92vw,440px);padding:20px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
label{font-size:13px;color:var(--sub);display:block;margin:0 0 4px 2px}
.empty{text-align:center;color:var(--sub);padding:50px 10px;line-height:2}
#toast{position:fixed;z-index:3;left:50%;bottom:96px;transform:translateX(-50%);background:var(--amber);color:#2a1c0e;padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
.hide{display:none!important}

h1{color:var(--amber);text-shadow:0 0 18px rgba(230,192,104,.45)}
.rays{position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 80px,rgba(255,226,150,.06) 115px,transparent 170px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 65%);mask-image:linear-gradient(180deg,#000,transparent 65%);animation:sway 16s ease-in-out infinite alternate}
@keyframes sway{from{opacity:.45;transform:translateX(-14px)}to{opacity:1;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
.card{border:1px solid var(--line);box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 0 0 4px rgba(214,178,98,.22),0 8px 22px rgba(0,0,0,.45)}
.ico{border:1px solid var(--line);border-radius:10px;background:rgba(230,192,104,.1)}
.drawer{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-size:16px}
.hud{display:flex;gap:18px;margin:0 0 14px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--glass);font-size:15px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
.fab{border:1px solid #fff3c4;box-shadow:0 0 22px rgba(230,192,104,.45),0 8px 24px rgba(0,0,0,.5)}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,9,6,.78);cursor:pointer;text-align:center;padding:24px;transition:opacity 1.2s}
#intro.out{opacity:0;pointer-events:none}
#intro small{color:var(--sub);letter-spacing:.3em;font-size:13px;margin-bottom:18px}
#intro h2{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-weight:500;font-size:clamp(24px,6.5vw,40px);letter-spacing:.2em;color:var(--amber);text-shadow:0 0 24px rgba(230,192,104,.6);min-height:1.7em;margin:0}
#introGo{margin-top:30px;padding:10px 22px;border:1px solid var(--line);border-radius:10px;background:var(--glass);opacity:0;transition:opacity 1s;animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{color:var(--amber)}}

#intro h2{font-size:clamp(34px,10vw,64px);letter-spacing:.35em;text-indent:.35em}

textarea{font:inherit;color:var(--ink);resize:vertical}
.v.note{white-space:pre-wrap;font-size:18px;line-height:1.7}

:root{--display:"Cinzel","Cormorant Garamond","Hiragino Mincho ProN",Georgia,serif}
h1,.drawer,#intro h2,.btn,.fab,.chip,.hud,#gotText{font-family:var(--display)}
h1{font-size:28px;letter-spacing:.18em}
#intro h2{letter-spacing:.3em;font-weight:700}
.tag{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;margin-bottom:6px}
.orn{color:var(--amber);opacity:.7;font-size:12px;letter-spacing:.3em;margin:0 0 14px}
.k{width:44px}
#introSub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--sub);margin:14px 0 0;opacity:0;transition:opacity 1.4s}
#introGo{font-family:var(--display);letter-spacing:.2em;font-size:15px}
#got{position:fixed;z-index:9;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);text-align:center;opacity:0;pointer-events:none}
#got.show{animation:got 2.3s ease forwards}
#gotIcon{font-size:64px;filter:drop-shadow(0 0 24px rgba(230,192,104,.9))}
#gotText{margin-top:8px;color:var(--amber);letter-spacing:.2em;font-size:16px;text-shadow:0 0 14px rgba(230,192,104,.8)}
@keyframes got{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-55%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
</style>
</head>
<body>
<div id="bg1"></div><canvas id="fly"></canvas><canvas id="rain"></canvas><div class="glow"></div>
<div id="intro"><h2 id="introText"></h2><p id="introSub">Whatever is written here, remains.</p><div id="introGo">▶ Enter the grove</div></div>
<div class="wrap">
  <h1>Hush Grove</h1>
  <p class="tag">A quiet place to keep what you think.</p>
  <div class="orn">◆ ─── ✦ ─── ◆</div>
  <div class="hud" id="hud"></div>
  <div class="bar">
    <input class="field" id="q" placeholder="Seek a memory…">
    
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<button class="fab" id="addBtn">＋ Add to Satchel</button>

<dialog id="dlg">
  <label>Name</label><input class="field" id="f_name" placeholder="What shall we call it?">
  <label>Belongs to (email)</label><input class="field" id="f_email" list="emails" placeholder="you@example.com">
  <datalist id="emails"></datalist>
  <label>Identity (only if different from the email)</label><input class="field" id="f_user">
  <label>Inscription — write anything</label><textarea class="field" id="f_pw" rows="4" autocomplete="off"></textarea>
  <label>Mark</label>
  <select class="field" id="f_icon"><option>🌐</option><option>🛒</option><option>🎬</option><option>💳</option><option>🏦</option><option>🎮</option><option>📚</option><option>💼</option><option>📱</option><option>🍽️</option><option>✈️</option></select>
  <label>Reflection</label><input class="field" id="f_memo" placeholder="A thought worth keeping">
  <button class="btn" id="save">Add to Satchel</button>
  <button class="btn g" id="cancel">Return</button>
  <button class="btn d hide" id="del">Let it go</button>
</dialog>
<div id="toast"></div>
<div id="got"><div id="gotIcon"></div><div id="gotText">Added to your satchel</div></div>

<script>
const $=s=>document.querySelector(s), KEY='kagi-oheya-plain-v1';
let entries=[],filter='',editId=null,showAll=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{entries=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){entries=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){toast('Unable to save in this browser')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}

function render(){
  const emails=[...new Set(entries.map(e=>e.email).filter(Boolean))];
  $('#emails').innerHTML=emails.map(e=>`<option value="${esc(e)}">`).join('');
  $('#chips').innerHTML=`<button class="chip ${!filter?'on':''}" data-e="">All ${entries.length}</button>`+
    emails.map(e=>`<button class="chip ${filter===e?'on':''}" data-e="${esc(e)}">${esc(e)} ${entries.filter(x=>x.email===e).length}</button>`).join('');
  if(!entries.length){$('#list').innerHTML='<div class="empty">まだ何もありません。<br>Nothing here yet.<br>To write is to remember; to remember is to exist.<br>Tap “＋ Add to Satchel” to begin.</div>';return}
  const q=$('#q').value.trim().toLowerCase(), g={};
  entries.filter(e=>(!filter||e.email===filter)&&(!q||[e.name,e.email,e.user,e.memo].join(' ').toLowerCase().includes(q)))
    .forEach(e=>(g[e.email||'(Unbound)']??=[]).push(e));
  $('#list').innerHTML=Object.keys(g).sort().map(k=>`<div class="drawer">❖ ${esc(k)} · ${g[k].length}</div>`+
    g[k].sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(card).join('')).join('')||'<div class="empty">Nothing was found.</div>';
}
function card(e){
  const id=e.user||e.email;
  return `<div class="card" data-id="${e.id}">
  <div class="top"><div class="ico">${esc(e.icon)}</div><div class="nm">${esc(e.name)}</div><button class="edit" data-act="edit">Revise</button></div>
  ${id?`<div class="row"><span class="k">ID</span><span class="v">${esc(id)}</span><button class="mini" data-act="cid" title="Copy">📋</button></div>`:''}
  ${e.pw?`<div class="row"><span class="k">Note</span><span class="v note">${esc(e.pw)}</span><button class="mini" data-act="cpw" title="Copy">📋</button></div>`:''}
  ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:''}</div>`;
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Could not copy')}}
$('#list').onclick=ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const c=b.closest('.card'),it=entries.find(x=>x.id===c.dataset.id);if(!it)return;
  const a=b.dataset.act;
  if(a==='eye'){const v=c.querySelector('[data-pw]');v.textContent=v.textContent==='••••••••'?it.pw:'••••••••'}
  if(a==='cpw')copy(it.pw);
  if(a==='cid')copy(it.user||it.email);
  if(a==='edit')openForm(it);
};
$('#chips').onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;filter=b.dataset.e;render()};
$('#q').oninput=render;


function openForm(it){
  editId=it?it.id:null;
  $('#f_name').value=it?.name||'';$('#f_email').value=it?.email||filter||'';$('#f_user').value=it?.user||'';
  $('#f_pw').value=it?.pw||'';$('#f_icon').value=it?.icon||'🌐';$('#f_memo').value=it?.memo||'';
  $('#del').classList.toggle('hide',!it);$('#dlg').showModal();
}
$('#addBtn').onclick=()=>openForm(null);
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{
  const name=$('#f_name').value.trim();if(!name){toast('Please give it a name');return}
  const o={id:editId||crypto.randomUUID(),name,email:$('#f_email').value.trim(),user:$('#f_user').value.trim(),pw:$('#f_pw').value,icon:$('#f_icon').value,memo:$('#f_memo').value.trim()};
  const i=entries.findIndex(x=>x.id===o.id);i>=0?entries[i]=o:entries.push(o);
  persist();$('#dlg').close();render();(i<0?obtained(o):toast('Revised'));
};
$('#del').onclick=()=>{if(!confirm('Release this memory?'))return;entries=entries.filter(x=>x.id!==editId);persist();$('#dlg').close();render()};
render();

/* 静かな雨: 奥(細く遅く淡い)と手前(長く速く少し明るい)の二層 */
(function(){
  const cv=$('#rain'),ctx=cv.getContext('2d');let W,H,drops=[];
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    drops=Array.from({length:Math.round(W/9)+30},()=>({x:Math.random()*(W+100),y:Math.random()*H,z:Math.random()}))}
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const d of drops){
      const len=8+d.z*d.z*30,sp=2.5+d.z*7;
      ctx.strokeStyle=`rgba(255,226,190,${.05+d.z*.2})`;ctx.lineWidth=.4+d.z*1.1;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-len*.12,d.y+len);ctx.stroke();
      if(!still){d.y+=sp;d.x-=sp*.12;if(d.y>H+40){d.y=-40;d.x=Math.random()*(W+100)}}
    }
    if(!still&&!document.hidden)requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{size();if(still)frame()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!still)requestAnimationFrame(frame)});
  size();frame();
})();

/* HUD */
const _render=render;
render=function(){_render();const m=new Set(entries.map(e=>e.email).filter(Boolean)).size;$('#hud').innerHTML=`<span>🎒 Satchel ${entries.length}</span><span>✉ Paths ${m}</span><span>✦ ${entries.length<3?'Seeker':entries.length<8?'Wanderer':entries.length<15?'Keeper':'Sage'}</span>`};
render();

/* 深い森 */
function rnd(s){return()=>(s=s*16807%2147483647)/2147483647}
function forest(){
 const cv=$('#forest'),d=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*d;cv.height=H*d;
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
 let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08120e');g.addColorStop(.55,'#12231a');g.addColorStop(1,'#1f2b1b');c.fillStyle=g;c.fillRect(0,0,W,H);
 const sc=W<520?.7:1;
 [{n:W/34,h:.5,col:'#243a2e',base:.8,fog:.5,blur:2},{n:W/58,h:.68,col:'#17291f',base:.9,fog:.45,blur:1}].forEach((L,li)=>{
  const r=rnd(11+li*17);c.filter=`blur(${L.blur}px)`;c.fillStyle=L.col;
  for(let i=0;i<L.n;i++){const x=r()*W,th=H*L.h*(.65+r()*.45),yb=H*L.base,tiers=6+Math.floor(r()*3);
   c.fillRect(x-2*sc,yb-th*.4,4*sc,th*.4+H);
   for(let t=0;t<tiers;t++){const y0=yb-th+t*th*.115,hw=(10+t*9)*sc*(1+li*.35);
    c.beginPath();c.moveTo(x,y0-th*.07);c.lineTo(x+hw,y0+th*.13);c.lineTo(x-hw,y0+th*.13);c.fill()}}
  c.filter='none';
  const f=c.createLinearGradient(0,H*(L.base-.4),0,H*(L.base+.12));f.addColorStop(0,'rgba(170,190,160,0)');f.addColorStop(.7,`rgba(170,190,160,${L.fog*.22})`);f.addColorStop(1,'rgba(170,190,160,0)');
  c.fillStyle=f;c.fillRect(0,0,W,H)});
 const r=rnd(99);c.fillStyle='#060c08';
 [.02,.11,.91,.99].forEach(p=>{const x=p*W,bw=(40+r()*30)*sc,yb=H*1.02;
  c.beginPath();c.moveTo(x-bw*1.5,yb);c.quadraticCurveTo(x-bw*.6,yb-H*.08,x-bw*.5,yb-H*.25);c.lineTo(x-bw*.4,-10);c.lineTo(x+bw*.4,-10);c.lineTo(x+bw*.5,yb-H*.25);c.quadraticCurveTo(x+bw*.6,yb-H*.08,x+bw*1.5,yb);c.fill()});
 g=c.createLinearGradient(0,H*.86,0,H);g.addColorStop(0,'rgba(5,10,7,0)');g.addColorStop(1,'rgba(5,10,7,.85)');c.fillStyle=g;c.fillRect(0,H*.86,W,H*.14);
}


/* 蛍(ほたる) */
(function(){const cv=$('#fly'),c=cv.getContext('2d');let W,H,f=[];const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
  f=Array.from({length:Math.round(W/40)+10},()=>({x:Math.random()*W,y:H*(.35+Math.random()*.6),p:Math.random()*6.28,s:.15+Math.random()*.3,r:2+Math.random()*3}))}
 function loop(t){c.clearRect(0,0,W,H);
  for(const m of f){const a=.15+.35*(.5+.5*Math.sin(t/900+m.p));const gr=c.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*4);
   gr.addColorStop(0,`rgba(255,235,150,${a})`);gr.addColorStop(1,'rgba(255,235,150,0)');c.fillStyle=gr;c.beginPath();c.arc(m.x,m.y,m.r*4,0,6.283);c.fill();
   if(!still){m.x+=Math.sin(t/3000+m.p)*m.s;m.y-=m.s*.25;if(m.y<H*.2)m.y=H*.95}}
  if(!still&&!document.hidden)requestAnimationFrame(loop)}
 addEventListener('resize',()=>{size();if(still)loop(0)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!still)requestAnimationFrame(loop)});
 size();requestAnimationFrame(loop)})();

/* 序章 */
(function(){const el=$('#intro'),t=$('#introText'),go=$('#introGo'),msg='Welcome';let i=0;
 function out(){el.classList.add('out');setTimeout(()=>el.remove(),1300)}
 el.onclick=()=>{if(i<msg.length){i=msg.length;t.textContent=msg;go.style.opacity=1;$('#introSub').style.opacity=1}else out()};
 (function tick(){if(i<msg.length){t.textContent=msg.slice(0,++i);setTimeout(tick,150)}else go.style.opacity=1;$('#introSub').style.opacity=1})();
})();

function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[659.25,880,1318.5].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1)})}catch(e){}}
function obtained(o){const g=$('#got');$('#gotIcon').textContent=o.icon;g.classList.remove('show');void g.offsetWidth;g.classList.add('show');chime();setTimeout(()=>g.classList.remove('show'),2300)}
</script>
</body>
</html>
